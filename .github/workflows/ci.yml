name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Stage 1: Lint & type-check ─────────────────────────────────────────────
  # Fast feedback — if this fails, nothing else runs.
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps + linters
        run: |
          pip install -r backend/requirements.txt
          pip install ruff pyright

      - name: Ruff lint (backend)
        run: ruff check backend/

      - name: Pyright type-check (backend)
        run: pyright backend/app/
        continue-on-error: true   # type stubs for third-party libs may be missing in CI

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --frozen-lockfile
        working-directory: frontend

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit
        working-directory: frontend

  # ── Stage 2: Docker build ──────────────────────────────────────────────────
  # Proves both images actually build before we try to run them.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 3: End-to-end tests ──────────────────────────────────────────────
  # Starts the full stack via docker compose, runs real HTTP requests,
  # and verifies data flow — not just status codes.
  #
  # LLM key strategy: OPENAI_API_KEY is intentionally left empty.
  # The app's keyword-based fallback activates automatically, so all
  # classification and chat endpoints work without burning real API credits.
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Create .env (no API key — keyword fallback will be used)
        run: |
          cp .env.example .env
          # Explicitly clear the key so the mock fallback activates
          echo "OPENAI_API_KEY=" >> .env

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Backend healthy."
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 3
          done

      - name: Run E2E test script
        run: BASE_URL=http://localhost:8000 bash tests/e2e.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
